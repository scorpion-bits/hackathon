<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>AgroBits — vídeo de 10 s</title>
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<style>
  /* Paleta oficial (docs/brand/paleta.png, tema escuro) */
  :root { --bg:#0F1A13; --surface:#1B2A20; --primary:#4CAF6D; --accent:#F2C94C; --alert:#E5484D; --text:#EAF2EC; --muted:#9FB3A6; }
  html, body { margin:0; background:#000; }
  #stage { position:relative; width:1920px; height:1080px; overflow:hidden; background:var(--bg); font-family:Inter, system-ui, sans-serif; color:var(--text); }
  #grid { position:absolute; inset:-200px; opacity:.0;
    background-image: linear-gradient(30deg, rgba(76,175,109,.07) 1px, transparent 1px), linear-gradient(150deg, rgba(76,175,109,.07) 1px, transparent 1px);
    background-size: 64px 37px; }
  #glow { position:absolute; left:50%; top:50%; width:1400px; height:1400px; margin:-700px; border-radius:50%;
    background: radial-gradient(circle, rgba(76,175,109,.16), rgba(76,175,109,0) 60%); opacity:0; }
  .chip { position:absolute; left:0; top:0; display:flex; align-items:center; gap:14px; padding:14px 22px 14px 16px; border-radius:999px;
    background:var(--surface); box-shadow: 0 0 0 1px rgba(234,242,236,.10), 0 18px 40px rgba(0,0,0,.35); white-space:nowrap; will-change:transform; }
  .chip i { width:14px; height:14px; border-radius:50%; flex:none; }
  .chip b { font-family:Montserrat, sans-serif; font-weight:700; font-size:15px; letter-spacing:.12em; color:var(--muted); }
  .chip span { font-weight:600; font-size:26px; }
  .phone { position:absolute; left:0; top:0; width:408px; height:850px; margin:-425px 0 0 -204px; border-radius:62px; background:#050806;
    box-shadow: 0 0 0 2px #24342a, 0 40px 90px rgba(0,0,0,.55); will-change:transform; }
  .screen { position:absolute; left:14px; top:14px; width:380px; height:822px; border-radius:50px; overflow:hidden; background:#F6F9F3; }
  .screen img { position:absolute; left:0; top:0; width:380px; display:block; }
  .notch { position:absolute; left:50%; top:26px; width:96px; height:26px; margin-left:-48px; border-radius:20px; background:#050806; z-index:3; }
  .tap { position:absolute; width:90px; height:90px; margin:-45px; border-radius:50%; background:rgba(76,175,109,.45); opacity:0; z-index:4; }
  .label { position:absolute; left:0; top:0; transform:translate(-50%,0); font-family:Montserrat, sans-serif; font-weight:700; font-size:22px;
    letter-spacing:.18em; text-transform:uppercase; color:var(--muted); opacity:0; white-space:nowrap; }
  #bridge { position:absolute; inset:0; opacity:0; }
  #card { position:absolute; left:0; top:0; width:330px; padding:18px 20px; border-radius:20px; background:#FFFFFF; color:#1C2B21;
    box-shadow: 0 24px 60px rgba(0,0,0,.45); opacity:0; will-change:transform; }
  #card small { display:block; font-weight:700; font-size:13px; letter-spacing:.14em; color:#2E7D4F; }
  #card strong { display:block; margin-top:6px; font-family:Montserrat, sans-serif; font-weight:800; font-size:22px; line-height:1.15; }
  #card p { margin:10px 0 0; display:flex; flex-wrap:wrap; gap:6px; }
  #card p em { font-style:normal; font-size:14px; font-weight:600; padding:4px 10px; border-radius:999px; background:#E3F1E7; color:#1F5C39; }
  #card p em.r { background:#FBE4E4; color:#C0392B; }
  #end { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  #logo { display:flex; align-items:center; gap:28px; }
  #logo img { width:190px; height:190px; will-change:transform; }
  #word { font-family:Montserrat, sans-serif; font-weight:800; font-size:132px; letter-spacing:-.02em; clip-path: inset(0 100% 0 0); }
  #tag { margin-top:34px; font-family:Montserrat, sans-serif; font-weight:700; font-size:46px; letter-spacing:-.01em; opacity:0; }
  #tag em { font-style:normal; color:var(--primary); }
  #src { position:absolute; left:0; right:0; bottom:44px; text-align:center; font-size:18px; color:var(--muted); opacity:0; letter-spacing:.04em; }
</style>
</head>
<body>
<div id="stage">
  <div id="grid"></div>
  <div id="glow"></div>
  <svg id="bridge" viewBox="0 0 1920 1080"><path id="arc" d="M 760 470 C 880 300, 1040 300, 1160 470" fill="none" stroke="#4CAF6D" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 0"/></svg>
  <div id="chips"></div>

  <div class="phone" id="pA"><div class="notch"></div><div class="screen">
    <img id="a1" src="../assets/img/app/02-inicio-full.png" alt="">
    <img id="a2" src="../assets/img/app/03-resolver-full.png" alt="">
    <img id="a3" src="../assets/img/app/04-enviado.png" alt="">
    <div class="tap" id="tap"></div>
  </div></div>
  <div class="phone" id="pB"><div class="notch"></div><div class="screen">
    <img id="b1" src="../assets/img/app/05-tecnico-full.png" alt="">
  </div></div>
  <div class="label" id="lA">Produtor</div>
  <div class="label" id="lB">Técnico público</div>

  <div id="card">
    <small>CASO AB-1002 · CATI</small>
    <strong>Quando plantar o milho do Talhão 2?</strong>
    <p><em>Araraquara/SP</em><em>3,06 ha · argiloso</em><em class="r">Zarc: 40% agora</em><em>63,7 mm em 7 dias</em></p>
  </div>

  <div id="end">
    <div id="logo"><img id="sym" src="../assets/img/brand/simbolo.png" alt=""><div id="word">AgroBits</div></div>
    <div id="tag">Leva o agrônomo até <em>quem nunca teve um.</em></div>
  </div>
  <div id="src">Dados abertos: Zarc/MAPA · Open-Meteo · NASA · IBGE · ANA — conta de demonstração</div>
</div>
<script>
// Linha do tempo determinística: seek(t) desenha o quadro do instante t (s). O exportador chama seek quadro a quadro.
const $ = (id) => document.getElementById(id)
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x))
const prog = (t, a, b) => clamp((t - a) / (b - a))
const lerp = (a, b, k) => a + (b - a) * k
const outCubic = (k) => 1 - Math.pow(1 - k, 3)
const inOutCubic = (k) => (k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2)
const outBack = (k, s = 1.5) => 1 + (s + 1) * Math.pow(k - 1, 3) + s * Math.pow(k - 1, 2)
const inCubic = (k) => k * k * k

// Valores REAIS do caso da conta demo (API /cases/{id}/brief, 03/10): nada inventado.
const CHIPS = [
  { k: 'LOCAL', v: 'Araraquara/SP', c: '#9FB3A6', x: 360, y: 250 },
  { k: 'TALHÃO', v: '3,06 ha', c: '#B7791F', x: 1490, y: 230 },
  { k: 'CULTURA', v: 'Milho', c: '#F2C94C', x: 300, y: 610 },
  { k: 'CHUVA', v: '63,7 mm · 7 dias', c: '#5BA7D9', x: 1530, y: 560 },
  { k: 'ZARC', v: 'risco 40% hoje', c: '#E5484D', x: 560, y: 880 },
  { k: 'SOLO', v: 'argiloso', c: '#4CAF6D', x: 1330, y: 860 },
]
const chipEls = CHIPS.map((d) => {
  const el = document.createElement('div')
  el.className = 'chip'
  el.innerHTML = `<i style="background:${d.c}"></i><b>${d.k}</b><span>${d.v}</span>`
  $('chips').appendChild(el)
  return el
})

function seek(t) {
  // --- fundo
  $('grid').style.opacity = lerp(0, 1, prog(t, 0, .8)) * (1 - prog(t, 7.6, 8.4) * .6)
  $('grid').style.transform = `translate(${-t * 6}px, ${-t * 3}px)`
  $('glow').style.opacity = .35 + .65 * prog(t, 2.3, 3.4) - .6 * prog(t, 7.4, 8.2)

  // --- 1. dados dispersos (0–2.4 s) → 2. convergem para o celular (2.5–3.6 s)
  const phoneA = { x: lerp(960, 640, inOutCubic(prog(t, 5.9, 6.8))), y: 560 }
  CHIPS.forEach((d, i) => {
    const el = chipEls[i]
    const t0 = .25 + i * .2
    const pop = prog(t, t0, t0 + .5)
    const drift = Math.sin(t * 1.3 + i) * 6
    let x = d.x + drift, y = d.y + Math.cos(t * 1.1 + i) * 5, s = pop ? outBack(pop, 2) : 0, o = clamp(pop * 2)
    const f0 = 2.55 + i * .07
    const fly = prog(t, f0, f0 + .75)
    if (fly > 0) {
      const k = inCubic(fly) * .25 + inOutCubic(fly) * .75
      const cx = (d.x + 960) / 2, cy = Math.min(d.y, 560) - 160
      x = (1 - k) * (1 - k) * d.x + 2 * (1 - k) * k * cx + k * k * 960
      y = (1 - k) * (1 - k) * d.y + 2 * (1 - k) * k * cy + k * k * 520
      s = lerp(1, .25, k); o = 1 - prog(fly, .7, 1)
    }
    el.style.opacity = o
    el.style.transform = `translate(-50%,-50%) translate(${x}px,${y}px) scale(${s})`
  })

  // --- celular do produtor: entra (2.1–3.0), absorve os dados, navega, vai para a esquerda (5.9–6.8)
  const enter = prog(t, 2.05, 3.0)
  const exit = prog(t, 7.55, 8.15)
  const yA = lerp(1500, phoneA.y, outBack(enter, 1.2)) + inCubic(exit) * 1400
  const rotA = lerp(-9, 0, outCubic(enter))
  const pulse = Math.sin(Math.PI * prog(t, 3.05, 3.55)) * .035
  const sA = lerp(1, .9, inOutCubic(prog(t, 5.9, 6.8))) + pulse
  $('pA').style.transform = `translate(${phoneA.x}px, ${yA}px) rotate(${rotA}deg) scale(${sA})`
  $('pA').style.boxShadow = `0 0 0 2px #24342a, 0 0 ${80 * Math.sin(Math.PI * prog(t, 3.0, 3.7))}px rgba(76,175,109,.55), 0 40px 90px rgba(0,0,0,.55)`

  // telas reais dentro do celular: Início → Resolver (risco Zarc) → caso enviado
  const sc = 380 / 1170
  const swipe1 = inOutCubic(prog(t, 4.15, 4.55))
  $('a1').style.transform = `translate(${-380 * swipe1}px, ${-lerp(0, 230, inOutCubic(prog(t, 3.1, 4.1)))}px)`
  // rola até o risco Zarc, depois desce rápido até o botão "Enviar meu caso" (y ≈ 2397 px na faixa)
  const scrollA2 = lerp(0, 120, inOutCubic(prog(t, 4.6, 5.05))) + lerp(0, 1640, inOutCubic(prog(t, 5.1, 5.45)))
  $('a2').style.transform = `translate(${380 * (1 - swipe1)}px, ${-scrollA2}px)`
  const cut = prog(t, 5.72, 5.88)
  $('a2').style.opacity = 1 - cut
  $('a3').style.opacity = cut
  // toque em "Enviar meu caso"
  const tp = prog(t, 5.48, 5.9)
  $('tap').style.opacity = tp > 0 && tp < 1 ? (1 - tp) : 0
  $('tap').style.transform = `translate(190px, 665px) scale(${lerp(.4, 1.8, outCubic(tp))})`

  // --- 3. a ponte: o caso vai até o técnico (6.0–7.2)
  const inB = prog(t, 6.0, 6.9)
  const xB = lerp(2400, 1280, outBack(inB, 1.1))
  $('pB').style.transform = `translate(${xB}px, ${560 + inCubic(exit) * 1400}px) scale(.9)`
  $('b1').style.transform = `translateY(${-lerp(0, 150, inOutCubic(prog(t, 7.0, 7.6)))}px)`
  $('bridge').style.opacity = prog(t, 6.3, 6.6) * (1 - prog(t, 7.3, 7.6))
  const arc = $('arc'), L = 520
  arc.style.strokeDasharray = `${L * outCubic(prog(t, 6.3, 6.9))} ${L}`
  const fly = prog(t, 6.25, 7.05)
  const k = inOutCubic(fly)
  const cx = (1 - k) * (1 - k) * 640 + 2 * (1 - k) * k * 960 + k * k * 1280
  const cy = (1 - k) * (1 - k) * 470 + 2 * (1 - k) * k * 250 + k * k * 470
  const cardIn = prog(t, 5.95, 6.25)
  $('card').style.opacity = clamp(cardIn * 2) * (1 - prog(t, 6.85, 7.1))
  $('card').style.transform = `translate(-50%,-50%) translate(${cx}px, ${cy}px) scale(${lerp(.6, 1, outBack(cardIn, 2)) * lerp(1, .5, prog(fly, .7, 1))}) rotate(${Math.sin(Math.PI * fly) * -4}deg)`
  for (const [id, x, a] of [['lA', 640, 6.7], ['lB', 1280, 6.9]]) {
    $(id).style.opacity = prog(t, a, a + .3) * (1 - prog(t, 7.5, 7.8))
    $(id).style.transform = `translate(-50%, 0) translate(${x}px, ${1000 + 20 * (1 - outCubic(prog(t, a, a + .3)))}px)`
  }

  // --- 4. marca + mensagem (7.9–10)
  const lg = prog(t, 7.95, 8.55)
  $('sym').style.transform = `scale(${lg ? outBack(lg, 1.8) : 0}) rotate(${lerp(-12, 0, outCubic(lg))}deg)`
  $('word').style.clipPath = `inset(0 ${100 - 100 * outCubic(prog(t, 8.25, 8.85))}% 0 0)`
  const tg = prog(t, 8.75, 9.25)
  $('tag').style.opacity = tg
  $('tag').style.transform = `translateY(${18 * (1 - outCubic(tg))}px)`
  $('src').style.opacity = prog(t, 9.0, 9.4) * .9
  $('end').style.opacity = lg > 0 ? 1 : 0
}
window.seek = seek
// reprodução ao vivo (abrir o arquivo no navegador): ?loop=1 repete
const loop = new URLSearchParams(location.search).has('loop')
if (!new URLSearchParams(location.search).has('render')) {
  let t0 = null
  const tick = (now) => { if (t0 == null) t0 = now; let t = (now - t0) / 1000; if (loop) t %= 10.5; seek(Math.min(t, 10)); requestAnimationFrame(tick) }
  requestAnimationFrame(tick)
} else seek(0)
</script>
</body>
</html>
